services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: vulntrace-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vulntrace-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    depends_on:
      falkordb:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

volumes:
  falkordb_data:
